  <path d="M33.2 23 C35.5 16, 39 13, 41.5 12" fill="none" stroke="#ececec" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="22.2" cy="12" r="1.3" fill="#ececec"/>
  <circle cx="41.8" cy="12" r="1.3" fill="#ececec"/>
</svg>
