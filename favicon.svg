  <path d="M34 35 C43 35, 51 41, 48 49 C45 54, 36 50, 33 41 Z" fill="#ececec" fill-opacity="0.88"/>
  <!-- Subtle darkroom eyespots -->
  <circle cx="19" cy="23" r="2.6" fill="#080808"/>
