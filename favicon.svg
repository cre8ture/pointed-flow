<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Butterfly Icon">
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#080808" stroke="#ececec" stroke-opacity="0.35" stroke-width="2"/>
  <!-- Upper forewings -->
  <path d="M31 28 C25 14, 11 11, 10 21 C9 29, 18 33, 30 33 Z" fill="#ececec"/>
  <path d="M33 28 C39 14, 53 11, 54 21 C55 29, 46 33, 34 33 Z" fill="#ececec"/>
